[package]
name = "skews-render"
description = "wgpu scene renderer: SDF shapes, images and damage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints.rust]
# This crate owns the single audited `unsafe` call site in the workspace:
# creating a wgpu surface from Wayland raw handles, which has no safe API.
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"

[dependencies]
wgpu = { workspace = true }
bytemuck = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
pollster = { workspace = true }
raw-window-handle = { workspace = true }
skews-core = { workspace = true }
