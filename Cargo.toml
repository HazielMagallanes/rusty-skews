[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = [
  "crates/skews-shell",
  "crates/skews-lock",
  "crates/skews-ctl",
]

[workspace.dependencies]
# Internal crates (layered; lower layers never depend on higher ones).
skews-core = { path = "crates/skews-core" }
skews-config = { path = "crates/skews-config" }
skews-theme = { path = "crates/skews-theme" }
skews-ipc-hyprland = { path = "crates/skews-ipc-hyprland" }
skews-sys-linux = { path = "crates/skews-sys-linux" }
skews-bus = { path = "crates/skews-bus" }
skews-services = { path = "crates/skews-services" }
skews-text = { path = "crates/skews-text" }
skews-layout = { path = "crates/skews-layout" }
skews-render = { path = "crates/skews-render" }
skews-ui = { path = "crates/skews-ui" }
skews-wayland = { path = "crates/skews-wayland" }
skews-app = { path = "crates/skews-app" }
skews-modules = { path = "crates/skews-modules" }
skews-testkit = { path = "crates/skews-testkit" }

# External dependencies (single source of truth for versions/features).
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
clap = { version = "4.6", features = ["derive"] }
cosmic-text = "0.19"
chrono = "0.4"
calloop = "0.14"
calloop-wayland-source = "0.4"
pollster = "1.0"
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smithay-client-toolkit = "0.21"
thiserror = "2.0"
taffy = "0.14"
notify = "8.2"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-client = { version = "0.31", features = ["system"] }
wgpu = "30.0"
xshell = "0.2"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
authors = ["Haziel Magallanes <contactame.haziel@gmail.com>"]
repository = "https://github.com/HazielMagallanes/rusty-skews"
homepage = "https://github.com/HazielMagallanes/rusty-skews"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

# Performance-first release profile (see docs/performance.md).
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

# Release + debug info, for profiling sessions.
[profile.release-debug]
inherits = "release"
debug = true
strip = false
panic = "unwind"

# Benches need unwinding for criterion's panic capture.
[profile.bench]
inherits = "release"
